<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ headline }}</title>
</head>
<body style="margin:0; padding:0; background-color:#fdf6f0; font-family:'Helvetica Neue', Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#fdf6f0; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%; background-color:#ffffff; border-radius:20px; overflow:hidden; box-shadow:0 4px 24px rgba(0,0,0,0.06);">

          <!-- Accent header -->
          <tr>
            <td align="center" style="background-color:{{ accent_color }}; padding:36px 24px 28px 24px;">
              <div style="font-size:48px; line-height:1; margin-bottom:8px;">{{ icon_emoji }}</div>
              <div style="font-family:Georgia, 'Times New Roman', serif; font-size:24px; font-weight:bold; color:#3d2b2b;">
                {{ headline }}
              </div>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:28px 32px 8px 32px; font-size:15px; line-height:1.6; color:#5a4a4a;">
              {{ body_html | safe }}
            </td>
          </tr>

          <!-- CTA button -->
          <tr>
            <td align="center" style="padding:24px 32px 32px 32px;">
              <a href="{{ cta_url }}"
                 style="display:inline-block; background-color:{{ accent_color }}; color:#3d2b2b; text-decoration:none;
                        font-weight:bold; font-size:15px; padding:14px 32px; border-radius:999px;">
                {{ cta_text }} →
              </a>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding:20px 24px 28px 24px; border-top:1px solid #f2e8e0;">
              <div style="font-family:Georgia, serif; font-style:italic; font-size:13px; color:#b89a9a;">
                Sent with 💛 from your Couples App
              </div>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
