# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# version location specification; this defaults to alembic/versions
# version_locations = %(here)s/alembic/versions

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
# timezone =

# max length of characters to prepend to syntax
# truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command
# revision_environment = false

# set to 'true' to allow modules to be loaded from sys.path
prepend_sys_path = .

# version path separator
# version_path_separator = ;

# set to 'true' to search for newer revision files recursively
# recursive_version_locations = false

# the output encoding used when writing new migration files
# output_encoding = utf-8

# This is overridden dynamically in env.py from config settings
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/couples_db

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
